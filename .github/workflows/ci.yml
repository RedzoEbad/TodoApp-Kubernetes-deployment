name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ✅ Install dependencies
      - name: Install dependencies
        run: npm ci

      # ✅ Security Scan (Snyk)
      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test --severity-threshold=high

      # ✅ Lint check
      - name: Code Linting
        run: npm run lint

      # ✅ Unit tests
      - name: Run tests
        run: npm test

      # ✅ SonarQube Scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 🟢 Start MongoDB
      - name: Start MongoDB
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:6
          sleep 5

      # 🟢 Start Server
      - name: Start Server
        env:
          MONGODB_URI: mongodb://localhost:27017/test
        run: |
          npm run build
          npm start &
          echo "Waiting for server..."

          for i in {1..15}; do
            curl -f http://localhost:3000/api/users/router && break
            echo "Waiting..."
            sleep 3
          done

      # 🧪 Install Newman
      - name: Install Newman
        run: npm install -g newman

      # 🧪 Run Postman tests
      - name: Run API tests with Newman
        run: newman run ./test/TodoApp.postman_collection.json --env-var "baseUrl=http://localhost:3000"