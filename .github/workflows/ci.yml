name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test --severity-threshold=high

      - name: Code Linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Start MongoDB
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:6
          sleep 5

      - name: Start Server
        env:
          MONGODB_URI: mongodb://localhost:27017/test
        run: |
          npm run build
          npm start &
          for i in {1..15}; do
            curl -f http://localhost:3000/api/users/router && break
            echo "Waiting..."
            sleep 3
          done

      - name: Install Newman
        run: npm install -g newman

      - name: Run API tests with Newman
        run: newman run ./test/TodoApp.postman_collection.json --env-var "baseUrl=http://localhost:3000"

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/my-todo-app:latest .

      - name: Scan image from Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --exit-code 0 --severity HIGH,CRITICAL --format table ${{ secrets.DOCKER_USERNAME }}/my-todo-app:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my-todo-app:latest