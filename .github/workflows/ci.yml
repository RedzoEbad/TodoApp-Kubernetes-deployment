name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # 2. Setup Node
      # =========================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # =========================
      # 3. Install dependencies
      # =========================
      - name: Install dependencies
        run: npm ci

      # =========================
      # 4. Lint
      # =========================
      - name: Code Linting
        run: npm run lint

      # =========================
      # 5. Tests
      # =========================
      - name: Run tests
        run: npm test

      # =========================
      # 6. Security Scan (Snyk)
      # =========================
      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test --severity-threshold=high

      # =========================
      # 7. SonarCloud Scan
      # =========================
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # =========================
      # 8. Start MongoDB (for tests)
      # =========================
      - name: Start MongoDB
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:6
          sleep 5

      # =========================
      # 9. Build & Start App (smoke test)
      # =========================
      - name: Build & Start Server
        env:
          MONGODB_URI: mongodb://localhost:27017/test
        run: |
          npm run build
          npm start &

          for i in {1..15}; do
            curl -f http://localhost:3000/api/users/router && break
            echo "Waiting..."
            sleep 3
          done

      # =========================
      # 10. API Tests (Newman)
      # =========================
      - name: Install Newman
        run: npm install -g newman

      - name: Run API tests
        run: newman run ./test/TodoApp.postman_collection.json --env-var "baseUrl=http://localhost:3000"

      # =========================
      # 11. Build Docker Image (NO CACHE)
      # =========================
      - name: Build Docker image
        run: |
          docker build --no-cache \
            -t ${{ secrets.DOCKER_USERNAME }}/my-todo-app:${{ github.sha }} .

      # =========================
      # 12. Trivy Scan
      # =========================
      - name: Scan image with Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --exit-code 0 --severity HIGH,CRITICAL \
            ${{ secrets.DOCKER_USERNAME }}/my-todo-app:${{ github.sha }}

      # =========================
      # 13. Login to Docker Hub
      # =========================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # =========================
      # 14. Push Docker Image
      # =========================
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/my-todo-app:${{ github.sha }}

      - name: Update GitOps repo (Argo CD sync trigger)
        env:
          TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/RedzoEbad/myapp-gitops.git

          cd myapp-gitops/apps/myapp/overlays/dev

          sed -i "s/newTag:.*/newTag: ${GITHUB_SHA}/" kustomization.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "update image tag ${GITHUB_SHA}"
          git push origin main