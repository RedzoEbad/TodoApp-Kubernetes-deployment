name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout full history (needed for SonarCloud)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ Setup Node + Cache
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ✅ Install dependencies
      - name: Install dependencies
        run: npm ci

      # ✅ Security Scan (Snyk)
      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test --severity-threshold=high

      # ✅ Lint check
      - name: Code Linting
        run: npm run lint

      # ✅ Run tests
      - name: Run tests
        run: npm test

      # ✅ SonarCloud Scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

       # ✅ Start MongoDB     
      - name: Start MongoDB
        run: docker run -d --name mongodb -p 27017:27017 mongo:6

      # ✅ Start Server
      - name: Start Server
        env:
          MONGODB_URI: mongodb://localhost:27017/test
        run: |
          npm start &
          sleep 10
          
      # Install Newman (Postman runner)
      - name: Install Newman
        run: npm install -g newman

      # Run API tests with Newman
      - name: Run API tests with Newman
        run: newman run ./test/TodoApp.postman_collection.json